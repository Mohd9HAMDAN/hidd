<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#66707d;--bd:#e0e4ea;--ac:#0b6b4f;--ac2:#e6f4ee;--wa:#1fa855;--warn:#a15c00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2129;--tx:#e8ecf1;--mu:#98a3b0;--bd:#2c3540;--ac:#4cc79b;--ac2:#173328;--wa:#3ddc84;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2129;--tx:#e8ecf1;--mu:#98a3b0;--bd:#2c3540;--ac:#4cc79b;--ac2:#173328;--wa:#3ddc84;--warn:#f0b35a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 4px}
.by{color:var(--ac);font-weight:700;font-size:.95rem;margin:0 0 14px}
.box{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
input{width:100%;font:inherit;font-size:1.1rem;padding:13px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);outline:none}
input:focus{border-color:var(--ac)}
.cnt{color:var(--mu);font-size:.85rem;margin:6px 2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.nm{font-weight:700;font-size:1.1rem}
.meta{color:var(--mu);font-size:.9rem;margin:2px 0 10px;display:flex;gap:6px 14px;flex-wrap:wrap}
.tag{background:var(--ac2);color:var(--ac);border-radius:8px;padding:0 8px;font-weight:500}
.cpr{direction:ltr;unicode-bidi:embed;font-variant-numeric:tabular-nums}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--bd);padding:8px 0;flex-wrap:wrap}
.num{direction:ltr;unicode-bidi:embed;font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px}
a.b{text-decoration:none;font-size:.9rem;padding:6px 12px;border-radius:9px;border:1px solid var(--bd);color:var(--tx)}
a.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:700}
.warn{color:var(--warn);font-size:.8rem}
.none{color:var(--mu);font-size:.9rem;padding-top:6px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
</style>
</head>

function card(r){
